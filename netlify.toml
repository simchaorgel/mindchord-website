# Astro is auto-detected by Netlify, so this file exists for the two things
# that are not inferred: the Node version and the cache policy for hashed
# assets. If the site's build settings are also set in the Netlify UI, the
# values here win.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json asks for >=22.12.0. Netlify's default tracks its own
  # schedule rather than the project's, and a version below that floor fails
  # the build outright — so it is pinned rather than left to be discovered.
  NODE_VERSION = "22"

# Everything Astro emits under /_astro is content-hashed: the filename
# changes whenever the bytes do, so a stale copy can never be served and the
# cache can be immortal. Netlify's default for these is far shorter.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
