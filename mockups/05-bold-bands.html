<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 5 — Bold EEG Bands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F0EB;        /* app/site background */
    --ink:#2C2825;          /* primary text */
    --muted:#6B635A;        /* secondary text */
    --coral:#C4704B;        /* accent */
    --sage:#7A8F7E;
    --sage-deep:#6A7F6E;
    --gold:#B8943F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  .serif{font-family:'Newsreader',Georgia,serif}

  /* ── Full-page atmosphere layer ──────────────────────────────────────
     The blobs live here, on a single fixed layer behind ALL content, so the
     colour spans the whole page continuously — behind the header, the text,
     and through the bands. (Previously they were trapped inside .hero, which
     is why they only ever showed behind the text.) */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(110px)}
  .blob-1{width:540px;height:540px;background:var(--coral);opacity:.18;top:-6%;left:4%}
  .blob-2{width:580px;height:580px;background:var(--sage);opacity:.22;top:-4%;right:0%}
  .blob-3{width:480px;height:480px;background:var(--gold);opacity:.16;top:34%;left:32%}
  .blob-4{width:560px;height:560px;background:var(--sage);opacity:.20;top:58%;left:-6%}
  .blob-5{width:540px;height:540px;background:var(--coral);opacity:.18;top:64%;right:-4%}
  @media(min-width:768px){.blob{filter:blur(140px)}}

  header{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:24px 40px}
  .brand{font-size:21px;letter-spacing:.3px}
  nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:30px;transition:color .2s}
  nav a:hover{color:var(--ink)}

  .hero{position:relative;z-index:1;min-height:calc(100vh - 76px);display:flex;flex-direction:column}

  .hero-copy{position:relative;z-index:3;text-align:center;padding:70px 24px 0;flex:0 0 auto}
  h1{font-size:clamp(50px,8vw,88px);line-height:1.0;letter-spacing:-.02em;font-weight:400}
  .sub{max-width:560px;margin:24px auto 0;color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.6}
  .cta{margin-top:34px;display:inline-flex;align-items:center;gap:10px;padding:16px 34px;border-radius:999px;
    background:linear-gradient(180deg,var(--sage),var(--sage-deep));color:var(--cream);text-decoration:none;
    font-size:16px;box-shadow:0 12px 30px -12px rgba(106,127,110,.7);
    transition:transform .2s,box-shadow .3s,filter .2s}
  .cta:hover{transform:translateY(-2px);filter:brightness(.96);box-shadow:0 18px 40px -14px rgba(106,127,110,.75)}
  .cta svg{width:16px;height:16px}

  /* bold, wide EEG bands — the rich visual feature, anchored to the bottom */
  .bands{position:absolute;left:0;right:0;bottom:0;z-index:1;width:100%;height:54vh;min-height:340px}
  canvas{display:block;width:100%;height:100%}
  /* cream fade so the bands emerge softly from the text area, not a hard edge */
  .fade{position:absolute;left:0;right:0;top:0;height:120px;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,var(--cream),rgba(245,240,235,0))}

  .tag{position:relative;z-index:4;text-align:center;color:#bcae9d;font-size:12px;
    letter-spacing:2px;text-transform:uppercase;padding:14px}
</style>
</head>
<body>
  <!-- full-page atmosphere layer, behind everything -->
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
  </div>

  <header>
    <div class="brand serif">Mindchord</div>
    <nav><a href="#">About</a><a href="#">Get started</a><a href="#">Contact</a></nav>
  </header>

  <section class="hero">

    <div class="hero-copy">
      <h1 class="serif">Upgrade your mind.</h1>
      <p class="sub">A take-home neurofeedback app that connects to portable EEG headsets to run the sessions your provider designs.</p>
      <a class="cta" href="#">Find out more
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.3 10.8a1 1 0 0 1 0-1.4 1 1 0 0 1 1.42 0L12 14.68l5.28-5.28a1 1 0 1 1 1.42 1.42l-5.83 5.83a1.25 1.25 0 0 1-1.77 0L5.3 10.8Z"/></svg>
      </a>
    </div>

    <div class="bands">
      <div class="fade"></div>
      <canvas id="eeg"></canvas>
    </div>
  </section>

  <div class="tag">Direction 5 — Bold EEG Bands</div>

<script>
(function(){
  const canvas=document.getElementById('eeg');
  const ctx=canvas.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=canvas.clientWidth;H=canvas.clientHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();addEventListener('resize',resize);

  // Bold, wide bands. Each is a thick flowing wave drawn as a filled ribbon
  // (an upper edge + a parallel lower edge), so it reads as a substantial
  // band rather than a thin line. Translucent + overlapping = warm richness.
  const bands=[
    {color:'196,112,75',  alpha:.55, thick:46, amp:.20, speed:.16, k:.012, seed:1.0, yoff:.30}, // coral
    {color:'122,143,126', alpha:.55, thick:54, amp:.24, speed:.13, k:.010, seed:3.4, yoff:.52}, // sage
    {color:'184,148,63',  alpha:.42, thick:40, amp:.18, speed:.18, k:.014, seed:6.1, yoff:.70}, // gold
  ];

  function wave(t,seed){
    return Math.sin(t*0.9+seed)*0.6 + Math.sin(t*1.9+seed*1.7)*0.3 + Math.sin(t*3.3+seed*2.3)*0.12;
  }

  const t0=performance.now();
  function draw(now){
    const e=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    ctx.lineJoin='round';ctx.lineCap='round';

    bands.forEach(b=>{
      const midY=H*b.yoff, amp=H*b.amp, half=b.thick/2, step=6;
      ctx.beginPath();
      // upper edge L→R
      for(let x=0;x<=W;x+=step){
        const y=midY+wave(e*b.speed+x*b.k,b.seed)*amp - half;
        x?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      // lower edge R→L (parallel, same wave) to close the ribbon
      for(let x=W;x>=0;x-=step){
        const y=midY+wave(e*b.speed+x*b.k,b.seed)*amp + half;
        ctx.lineTo(x,y);
      }
      ctx.closePath();
      const g=ctx.createLinearGradient(0,midY-amp-half,0,midY+amp+half);
      g.addColorStop(0,'rgba('+b.color+','+(b.alpha*0.85)+')');
      g.addColorStop(.5,'rgba('+b.color+','+b.alpha+')');
      g.addColorStop(1,'rgba('+b.color+','+(b.alpha*0.7)+')');
      ctx.fillStyle=g;ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
