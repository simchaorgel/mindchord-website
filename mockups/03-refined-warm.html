<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup 3 — Refined Warm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EC;         /* cleaner, slightly brighter cream */
    --ink:#23201C;           /* true near-black warm anchor */
    --muted:#7A7165;
    --coral:#D5603A;         /* ONE confident accent, more saturated than before */
    --coral-deep:#B84A29;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .serif{font-family:'Newsreader',Georgia,serif}

  header{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;
    position:sticky;top:0;z-index:5;background:rgba(247,243,236,.78);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(35,32,28,.07)}
  .brand{font-size:21px}
  nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:30px;transition:color .2s}
  nav a:hover{color:var(--ink)}

  .hero{position:relative;text-align:center;padding:96px 24px 0;overflow:hidden}
  .eyebrow{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--coral);font-weight:500;margin-bottom:22px}
  h1{font-size:clamp(46px,7vw,84px);line-height:1.02;letter-spacing:-.02em;font-weight:400}
  h1 em{font-style:italic;color:var(--coral)}
  .sub{max-width:580px;margin:24px auto 0;color:var(--muted);font-size:clamp(16px,2vw,19px);line-height:1.65}

  .cta{margin-top:36px;display:inline-flex;align-items:center;gap:10px;padding:16px 32px;border-radius:999px;
    background:var(--coral);color:#FBF6EF;text-decoration:none;font-weight:500;font-size:15px;
    box-shadow:0 10px 28px -8px rgba(181,74,41,.5);transition:transform .2s,box-shadow .3s,background .2s}
  .cta:hover{transform:translateY(-2px);background:var(--coral-deep);box-shadow:0 16px 36px -10px rgba(181,74,41,.55)}
  .cta svg{width:16px;height:16px}

  /* bold single-colour signal on cream — no blurry blobs */
  .signal-wrap{margin-top:54px;width:100%}
  canvas{display:block;width:100%;height:300px}
  .readout{display:flex;justify-content:center;gap:46px;padding:6px 0 80px;color:var(--muted);font-size:12.5px;letter-spacing:.5px}
  .readout b{color:var(--coral);font-weight:600;font-variant-numeric:tabular-nums}
  .label{text-align:center;color:#c2b6a6;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding-bottom:40px}
</style>
</head>
<body>
  <header>
    <div class="brand serif">Mindchord</div>
    <nav><a href="#">About</a><a href="#">Get started</a><a href="#">Contact</a></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Take-home neurofeedback</div>
    <h1 class="serif">Upgrade your <em>mind</em>.</h1>
    <p class="sub">Mindchord connects to portable EEG headsets to run the neurofeedback sessions your provider designs — at home, on your schedule.</p>
    <a class="cta" href="#">Find out more
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 5.3a1 1 0 0 1 1.4 0l5.8 5.8a1.25 1.25 0 0 1 0 1.77l-5.8 5.83a1 1 0 0 1-1.42-1.41L17.18 13H4.75a1 1 0 1 1 0-2h12.43l-3.98-3.98a1 1 0 0 1 0-1.42Z"/></svg>
    </a>
  </section>

  <div class="signal-wrap"><canvas id="eeg"></canvas></div>
  <div class="readout">
    <span>SIGNAL <b id="r1">—</b></span>
    <span>Z-SCORE <b id="r2">—</b></span>
    <span>IN-ZONE <b id="r3">—</b></span>
  </div>

  <div class="label">Direction 3 — Refined Warm</div>

<script>
(function(){
  const canvas=document.getElementById('eeg');const ctx=canvas.getContext('2d');
  let W,H,DPR;
  function resize(){DPR=window.devicePixelRatio||1;W=canvas.clientWidth;H=canvas.clientHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize();addEventListener('resize',resize);
  function sample(t,seed){
    const slow=Math.sin(t*0.6+seed)*0.5+Math.sin(t*1.3+seed*1.7)*0.27;
    const fast=Math.sin(t*9+seed*3.1)*0.15+Math.sin(t*17+seed*5.7)*0.09+Math.sin(t*30+seed*7.3)*0.05;
    return Math.max(-1,Math.min(1,slow+fast));
  }
  const t0=performance.now();
  function draw(now){
    const e=(now-t0)/1000;ctx.clearRect(0,0,W,H);
    const mid=H*0.5,amp=H*0.34,step=2;
    const pts=[];
    for(let x=0;x<=W;x+=step){const tx=e*0.18+x*0.012;pts.push([x,mid+sample(tx,7.7)*amp]);}
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(213,96,58,0.18)');g.addColorStop(1,'rgba(213,96,58,0)');
    ctx.beginPath();ctx.moveTo(0,H);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle=g;ctx.fill();
    // soft shadow pass for depth
    ctx.save();ctx.shadowColor='rgba(181,74,41,0.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=3;
    ctx.lineWidth=3;ctx.strokeStyle='#D5603A';ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.restore();
    const last=pts[pts.length-1];
    ctx.beginPath();ctx.arc(last[0]-2,last[1],4.5,0,7);ctx.fillStyle='#B84A29';ctx.fill();
    const v=sample(e*0.18+W*0.012,7.7);
    document.getElementById('r1').textContent=(70+v*18).toFixed(1)+' µV';
    document.getElementById('r2').textContent=(v>=0?'+':'')+(v*2.1).toFixed(2);
    document.getElementById('r3').textContent=Math.round(50+v*42)+'%';
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
